[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-recognition"
version = "2.0.0"
description = "Ship image recognition, classification, and training platform"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",

    # Validation & Config
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # HTTP & Scraping
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",

    # ML / Image Classification (install CPU-only if DLL issues:
    # pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu)
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",
    "transformers>=4.36.0",
    "Pillow>=10.0.0",
    "safetensors>=0.4.0",

    # Logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
gpu = [
    # Install CUDA-specific torch separately:
    # pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["backend*"]
